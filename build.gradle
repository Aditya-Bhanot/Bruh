plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

import org.gradle.jvm.toolchain.JavaLanguageVersion

version = '1.0.0'
group = 'attrium.ru'

def localBuildRoot = System.getenv("LOCALAPPDATA")
if (localBuildRoot != null && !localBuildRoot.isBlank()) {
	layout.buildDirectory = file("${localBuildRoot}/Attrium/gradle-build")
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()

	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	compileOnly 'org.projectlombok:lombok:1.18.38'
	annotationProcessor 'org.projectlombok:lombok:1.18.38'
	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

loom {
	runs {
		client {
			programArgs "--username", "Baflllik_"
		}
	}
}

processResources {
	def resourceProperties = [
		version             : project.version,
		minecraft_dependency: project.minecraft_version
	]
	inputs.properties(resourceProperties)

	filesMatching("fabric.mod.json") {
		expand resourceProperties
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = "UTF-8"
}

tasks.withType(JavaExec).configureEach {
	javaLauncher = javaToolchains.launcherFor {
		languageVersion = JavaLanguageVersion.of(21)
	}
	doFirst {
		def metadata = javaLauncher.get().metadata
		if (metadata.vendor.toString().toLowerCase(Locale.ROOT).contains('jetbrains')) {
			jvmArgs('-XX:+AllowEnhancedClassRedefinition')
		}
	}
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}

	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}


// [BRUH-SIZE-OPTIMIZATION]
tasks.withType(JavaCompile).configureEach {
    // Strip heavy LocalVariableTable/LocalVariableTypeTable debug bloat (~25% smaller .class files)
    options.compilerArgs += ["-g:source,lines"]
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    exclude "**/*.html", "**/*.psd", "**/*.bak", "**/*.md"
}

// --- Attrium Automated Randomized Release Obfuscation (Zero Source Modification) ---
configurations {
    attriumProguard
}

dependencies {
    attriumProguard 'com.guardsquare:proguard-base:7.6.1'
}

tasks.register('generateObfDictionaries') {
    doLast {
        def rng = new java.security.SecureRandom()
        def lower = 'abcdefghijklmnopqrstuvwxyz'
        def alpha = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ'
        def writeDict = { File target, int count, int minLen, int maxLen ->
            target.parentFile.mkdirs()
            def seen = new LinkedHashSet<String>()
            while (seen.size() < count) {
                int len = minLen + rng.nextInt(maxLen - minLen + 1)
                def sb = new StringBuilder(len)
                for (int i = 0; i < len; i++) {
                    sb.append(alpha.charAt(rng.nextInt(alpha.length())))
                }
                seen.add(sb.toString())
            }
            target.text = seen.join('\n') + '\n'
        }
        writeDict(file('build/proguard-dict.txt'), 2000, 3, 7)
        writeDict(file('build/proguard-class-dict.txt'), 800, 4, 8)

        def pkgSb = new StringBuilder(3)
        for (int i = 0; i < 3; i++) {
            pkgSb.append(lower.charAt(rng.nextInt(lower.length())))
        }
        def flatPkg = pkgSb.toString()
        file('build/proguard-dynamic.pro').text = "-repackageclasses '${flatPkg}'\n"
        println "[Attrium Obfuscator] Generated fresh random flat package: ${flatPkg}/"
    }
}

tasks.register('obfuscateJar', JavaExec) {
    dependsOn tasks.named('remapJar'), tasks.named('generateObfDictionaries')
    classpath = configurations.attriumProguard
    mainClass = 'proguard.ProGuard'

    doFirst {
        def baseName = project.findProperty('archives_base_name') ?: project.name
        def inJar = tasks.named('remapJar').get().archiveFile.get().asFile
        def outJar = layout.buildDirectory.file("libs/${baseName}-${project.version}-obf-raw.jar").get().asFile
        outJar.parentFile.mkdirs()
        if (outJar.exists()) {
            outJar.delete()
        }

        def pgArgs = [
            '-injars', inJar.absolutePath,
            '-outjars', outJar.absolutePath,
            '-include', file('proguard-rules.pro').absolutePath,
            '-include', file('build/proguard-dynamic.pro').absolutePath
        ]

        def javaHome = System.getProperty('java.home')
        def jmodsDir = file("${javaHome}/jmods")
        if (jmodsDir.exists()) {
            jmodsDir.listFiles().each { f ->
                if (f.name.endsWith('.jmod')) {
                    pgArgs.add('-libraryjars')
                    pgArgs.add("${f.absolutePath}(!**.jar;!module-info.class)")
                }
            }
        }

        def seenLibs = new LinkedHashSet<String>()
        configurations.compileClasspath.files.each { f ->
            if (f.exists() && seenLibs.add(f.absolutePath)) {
                pgArgs.add('-libraryjars')
                pgArgs.add(f.absolutePath)
            }
        }
        args = pgArgs
    }
}

tasks.register('scrubObfJar') {
    dependsOn tasks.named('obfuscateJar')
    doLast {
        def baseName = project.findProperty('archives_base_name') ?: project.name
        def rawJar = layout.buildDirectory.file("libs/${baseName}-${project.version}-obf-raw.jar").get().asFile
        def finalJar = layout.buildDirectory.file("libs/${baseName}-${project.version}-obf.jar").get().asFile
        int flattenedCount = 0
        int totalClasses = 0
        def zis = new java.util.zip.ZipInputStream(new FileInputStream(rawJar))
        def zos = new java.util.zip.ZipOutputStream(new FileOutputStream(finalJar))
        try {
            def entry
            def buf = new byte[8192]
            while ((entry = zis.nextEntry) != null) {
                def name = entry.name
                if (name.endsWith('.java') || name.endsWith('.bak') || name.endsWith('.map')) {
                    continue
                }
                if (name.endsWith('.class')) {
                    totalClasses++
                    if (!name.startsWith('attrium/')) {
                        flattenedCount++
                    }
                }
                def cleanEntry = new java.util.zip.ZipEntry(name)
                cleanEntry.setTime(0L)
                zos.putNextEntry(cleanEntry)
                int len
                while ((len = zis.read(buf)) > 0) {
                    zos.write(buf, 0, len)
                }
                zos.closeEntry()
            }
        } finally {
            zis.close()
            zos.close()
        }
        rawJar.delete()
        println "[Attrium Obfuscator] Ready: ${finalJar.name} (${flattenedCount}/${totalClasses} classes flattened into random package)"
    }
}
