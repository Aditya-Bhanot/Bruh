name: Build & Publish Flattened Hardened Release

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout clean source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build, Flatten & Scrub Release JAR
        run: |
          chmod +x gradlew
          ./gradlew clean build scrubObfJar --no-daemon

      - name: Publish Rolling Latest Release (Hardened JAR Only)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Attrium Latest Release
          body: "Automated flattened & obfuscated build from commit `${{ github.sha }}`."
          prerelease: false
          make_latest: true
          files: build/libs/*-obf.jar
