name: Build & Publish Auto-Versioned Hardened Release

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout clean source
        uses: actions/checkout@v4

      - name: Compute Next Auto-Increment Version (1.5.9 -> 1.6.0 -> 1.6.1...)
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LAST_TAG=$(gh release list --limit 20 --json tagName --jq '.[].tagName' | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)
          if [ -z "$LAST_TAG" ]; then
            NEXT_VER="1.5.9"
          else
            CLEAN="${LAST_TAG#v}"
            IFS='.' read -r MAJ MIN PAT <<< "$CLEAN"
            PAT=$((PAT + 1))
            if [ "$PAT" -ge 10 ]; then
              PAT=0
              MIN=$((MIN + 1))
              if [ "$MIN" -ge 10 ]; then
                MIN=0
                MAJ=$((MAJ + 1))
              fi
            fi
            NEXT_VER="${MAJ}.${MIN}.${PAT}"
          fi
          echo "version=${NEXT_VER}" >> "$GITHUB_OUTPUT"
          echo "Computed release version: ${NEXT_VER} (previous tag: ${LAST_TAG:-none})"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build, Flatten & Rename Release JAR
        run: |
          chmod +x gradlew
          ./gradlew clean build scrubObfJar -Pmod_version=${{ steps.ver.outputs.version }} --no-daemon --stacktrace
          OBF_JAR=$(ls -t build/libs/*-obf.jar | head -n 1)
          FINAL_JAR="build/libs/Attrium-Client-${{ steps.ver.outputs.version }}.jar"
          mv "$OBF_JAR" "$FINAL_JAR"
          ls -lh "$FINAL_JAR"

      - name: Remove All Old Releases & Old JARs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for tag in $(gh release list --limit 100 --json tagName --jq '.[].tagName'); do
            echo "Deleting old release: $tag"
            gh release delete "$tag" --yes --cleanup-tag || true
          done

      - name: Publish Auto-Versioned Release (Attrium-Client-X.Y.Z.jar)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Attrium Client ${{ steps.ver.outputs.version }}
          body: "Automated hardened release `v${{ steps.ver.outputs.version }}` from commit `${{ github.sha }}`."
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: build/libs/Attrium-Client-${{ steps.ver.outputs.version }}.jar
